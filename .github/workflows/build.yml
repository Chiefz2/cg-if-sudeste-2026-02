name: Compilacao OpenGL
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FreeGLUT
        run: sudo apt-get update && sudo apt-get install -y build-essential freeglut3-dev libglu1-mesa-dev mesa-common-dev
      - name: Compilar exemplos
        run: make -C Exemplos && make -C Exemplos clean
